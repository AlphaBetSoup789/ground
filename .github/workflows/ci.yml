name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Verify toolchain and install-script policy
        run: npm run toolchain:check && npm run install-scripts:check

      - name: Install locked dependencies
        run: npm ci

      - name: Check build-dependency compatibility
        run: npm run build-deps:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Linux renderer-test display dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends --yes xauth xvfb

      - name: Exercise renderer interactions in Electron
        if: runner.os != 'Linux'
        run: npm run test:e2e:renderer

      - name: Exercise renderer interactions in Electron under Xvfb
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1440x960x24"
          npm run test:e2e:renderer

      - name: Exercise the production native clipboard boundary
        if: runner.os != 'Linux'
        run: npm run smoke:clipboard:native

      - name: Exercise the production native clipboard boundary under Xvfb
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1440x960x24"
          npm run smoke:clipboard:native

      - name: Verify adapter SDK package
        run: npm run adapter-sdk:pack-check

      - name: Check production license inventory
        run: npm run licenses:check

      - name: Build
        run: npm run build

  audit-dependencies:
    name: Audit locked dependency tree
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Verify toolchain and install-script policy
        run: npm run toolchain:check && npm run install-scripts:check

      - name: Audit application, Electron, and build dependencies
        run: npm audit --audit-level=high

      - name: Check production license inventory
        run: npm run licenses:check
