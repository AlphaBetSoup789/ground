name: Feature request
description: Propose a focused product or architecture improvement
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Explain the user outcome first. New provider, runtime, storage, permission,
        privacy, and release-system proposals need an explicit portability and threat
        analysis.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user outcome is blocked today, and for whom?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior rather than only an implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds and reasons they are insufficient.

  - type: textarea
    id: portability
    attributes:
      label: Provider portability and security impact
      description: Explain changes to data egress, secrets, tools, permissions, storage, runtime authority, or adapter behavior.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Note affected providers, runtimes, platforms, persisted data, and accessibility.

  - type: checkboxes
    id: principles
    attributes:
      label: Ground principles
      options:
        - label: This proposal does not make a Ground-hosted model relay mandatory.
          required: true
        - label: This proposal preserves a readable provider-neutral task history.
          required: true
        - label: I removed private source, credentials, transcripts, and account data.
          required: true
