name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CI: true

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Verify toolchain and install-script policy
        run: npm run toolchain:check && npm run install-scripts:check

      - name: Require protected tag from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF_PROTECTED" = "true"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: Require tag to match package version
        run: >-
          node -e "const expected = 'v' + require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error('Release tag must be ' + expected);
          }"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Install renderer-test display dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends --yes xauth xvfb

      - name: Exercise renderer interactions in Electron under Xvfb
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1440x960x24"
          npm run test:e2e:renderer

      - name: Audit application, Electron, and build dependencies
        run: npm audit --audit-level=high

  package:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            slug: macos-arm64
            os: macos-15
            architecture: arm64
          - platform: macOS-x64
            slug: macos-x64
            os: macos-15-intel
            architecture: x64
          - platform: Windows-x64
            slug: windows-x64
            os: windows-2025
            architecture: x64
          - platform: Linux-x64
            slug: linux-x64
            os: ubuntu-24.04
            architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          node -e "if (process.arch !== process.env.EXPECTED_ARCHITECTURE)
          throw new Error('Expected ' + process.env.EXPECTED_ARCHITECTURE +
          ' runner, received ' + process.arch)"

      - name: Verify toolchain and install-script policy
        run: npm run toolchain:check && npm run install-scripts:check

      - name: Install locked dependencies
        run: npm ci

      - name: Install Linux packaged-launch smoke dependency
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends --yes
          dbus-x11 gnome-keyring libsecret-1-0 xauth xvfb

      - name: Build release source without signing credentials
        run: npm run build

      - name: Package signed and notarized macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          ./node_modules/.bin/electron-builder \
            --mac zip dmg --publish never --${{ matrix.architecture }}

      - name: Package explicitly unsigned Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_NAME -ErrorAction SilentlyContinue
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          & ./node_modules/.bin/electron-builder.cmd --win nsis --publish never --x64

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: >-
          ./node_modules/.bin/electron-builder
          --linux AppImage deb --publish never --x64

      - name: Verify macOS signing, Gatekeeper, and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          verify_app() {
            local candidate="$1"
            local expected_bundle_id
            expected_bundle_id="$(node -p "require('./package.json').build.appId")"
            local actual_bundle_id
            actual_bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$candidate/Contents/Info.plist")"
            test "$actual_bundle_id" = "$expected_bundle_id"
            codesign --verify --deep --strict --verbose=2 "$candidate"
            local actual_team
            actual_team="$(codesign -dv --verbose=4 "$candidate" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            test "$actual_team" = "$APPLE_TEAM_ID"
            spctl --assess --type execute --verbose=2 "$candidate"
            xcrun stapler validate "$candidate"
          }
          apps=(release/mac*/Ground.app)
          test "${#apps[@]}" -eq 1
          app_path="${apps[0]}"
          verify_app "$app_path"
          package_version="$(node -p "require('./package.json').version")"
          zip_path="release/Ground-${package_version}-mac-${{ matrix.architecture }}.zip"
          dmg_path="release/Ground-${package_version}-mac-${{ matrix.architecture }}.dmg"
          test -f "$zip_path"
          test -f "$dmg_path"
          extracted="$(mktemp -d "$RUNNER_TEMP/ground-mac-signature.XXXXXX")"
          trap 'rm -rf "$extracted"' EXIT
          ditto -x -k "$zip_path" "$extracted"
          verify_app "$extracted/Ground.app"
          hdiutil verify "$dmg_path"

      - name: Verify Windows release executables are unsigned
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release/Ground-*-windows-x64.exe)
          if ($installer.Count -ne 1) {
            throw "Expected exactly one Windows installer"
          }
          $targets = @($installer[0], (Get-Item release/win-unpacked/Ground.exe))
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "$($target.Name) must be explicitly unsigned until Ground defines a Windows signing policy: $($signature.Status)"
            }
          }

      - name: Verify exact target artifact inventory
        run: npm run package-artifacts:verify

      - name: Prepare Linux Chromium sandbox for packaged smoke
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat --format='%u:%g:%a' release/linux-unpacked/chrome-sandbox)" = "0:0:4755"

      - name: Smoke-test packaged main and preload startup
        run: npm run smoke:package:launch

      - name: Smoke-test packaged provider turn and native runtime
        if: runner.os != 'Linux'
        run: npm run smoke:package:native

      - name: Smoke-test installed or extracted distributable
        if: runner.os != 'Linux'
        run: npm run smoke:package:distributable

      - name: Smoke-test packaged provider turn and native runtime with ephemeral Secret Service
        if: runner.os == 'Linux'
        shell: bash
        env:
          GROUND_PACKAGE_SMOKE_PREPARE_SANDBOX: sudo
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/ground-keyring-runtime"
            mkdir -p -m 700 "$XDG_RUNTIME_DIR"
            eval "$(printf "%s\n" ground-packaged-smoke | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            npm run smoke:package:native
            npm run smoke:package:distributable
          '

      - name: Inventory packages shipped in app.asar
        run: >-
          node scripts/generate-packaged-components.mjs
          "release/ground-packaged-components-${{ matrix.slug }}.json"
          release

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            release/Ground-*.zip
            release/Ground-*.dmg
            release/Ground-*.exe
            release/Ground-*.AppImage
            release/Ground-*.deb
            release/ground-package-runtime-evidence-*.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ground-${{ matrix.platform }}
          path: |
            release/Ground-*.zip
            release/Ground-*.dmg
            release/Ground-*.exe
            release/Ground-*.AppImage
            release/Ground-*.deb
            release/ground-packaged-components-*.json
            release/ground-package-runtime-evidence-*.json
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Publish draft release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Verify toolchain and install-script policy
        run: npm run toolchain:check && npm run install-scripts:check

      - name: Install locked dependencies
        run: npm ci

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Ground-*
          path: artifacts
          merge-multiple: true

      - name: Verify exact release artifact inventory
        run: npm run package-artifacts:verify -- --all artifacts

      - name: Verify distributable runtime evidence
        run: npm run package-evidence:verify -- artifacts

      - name: Generate runtime-inclusive CycloneDX SBOM
        shell: bash
        run: node scripts/generate-release-sbom.mjs artifacts/ground-release-sbom.cdx.json artifacts

      - name: Verify packaged-component and artifact SBOM coverage
        shell: bash
        run: node scripts/verify-release-sbom.mjs artifacts/ground-release-sbom.cdx.json artifacts

      - name: Generate checksums
        run: node scripts/generate-release-checksums.mjs artifacts/SHA256SUMS.txt artifacts

      - name: Attest SBOM against release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            artifacts/Ground-*.zip
            artifacts/Ground-*.dmg
            artifacts/Ground-*.exe
            artifacts/Ground-*.AppImage
            artifacts/Ground-*.deb
          sbom-path: artifacts/ground-release-sbom.cdx.json

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --draft
          --prerelease
          --verify-tag
          --generate-notes
          --title "Ground ${GITHUB_REF_NAME#v}"
